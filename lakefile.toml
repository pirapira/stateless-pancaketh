name = "Guest"
version = "0.1.0"
defaultTargets = ["Guest"]

# Pinned to flapjack's HEAD as of this setup; bump deliberately (and re-check
# lean-toolchain compatibility) rather than tracking main unpinned.
[[require]]
name = "flapjack"
git = "https://github.com/pirapira/flapjack"
rev = "4f4a8cc8e8f38b01356e6aa35383eb1db18bc1cc"

[[lean_lib]]
name = "Guest"

# `lake exe gen-guest-ast Guest/guest.pp.pnk > Guest/Ast.lean` regenerates the
# committed AST of the guest (see tools/gen-guest-ast.sh).
[[lean_exe]]
name = "gen-guest-ast"
root = "Tools.GenGuestAst"

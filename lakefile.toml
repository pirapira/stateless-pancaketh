name = "Guest"
version = "0.1.0"
defaultTargets = ["Guest"]

# Pinned to flapjack's HEAD as of this setup (needs PR 403, the memory model in
# the stepped semantics); bump deliberately (and re-check lean-toolchain
# compatibility) rather than tracking main unpinned.
[[require]]
name = "flapjack"
git = "https://github.com/pirapira/flapjack"
rev = "9f13fe523d889e7f90463f07e7abc5ecad7d693f"

[[lean_lib]]
name = "Guest"

# `lake exe gen-guest-ast Guest/guest.pp.pnk > Guest/Ast.lean` regenerates the
# committed AST of the guest (see tools/gen-guest-ast.sh).
[[lean_exe]]
name = "gen-guest-ast"
root = "Tools.GenGuestAst"

# `lake exe run-guest [input.bin] [fuel]` executes the guest under the stepped
# source semantics, as Guest.runGuestStepped defines it.
[[lean_exe]]
name = "run-guest"
root = "Tools.RunGuest"

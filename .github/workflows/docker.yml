name: Docker – EEST ziskemu image

on:
  workflow_dispatch:
  push:
    tags:
      - 'docker/*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: pirapira/stateless-pancaketh

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      # Only evm-asm is needed (its scripts/); cakeml, flapjack, and
      # riscv-isa-sim are excluded via .dockerignore and not fetched here --
      # flapjack is a lake dependency the Dockerfile's own build fetches, and
      # cakeml/riscv-isa-sim are only needed for Spike/cake, not ziskemu.
      - name: Initialize evm-asm submodule
        run: git submodule update --init evm-asm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=ziskemu-v0.18.0-{{sha}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            GIT_REF=${{ github.ref_name }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          # GHA layer cache: the ziskemu Rust build and the Lean/flapjack
          # build are both cached after the first run, so subsequent pushes
          # are fast.
          cache-from: type=gha
          cache-to: type=gha,mode=max
